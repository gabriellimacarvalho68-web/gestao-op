<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Gestão Operações</title>
  <meta name="description" content="Painel de gestão de compra e venda de contas">
  <meta name="theme-color" content="#F5F5F7">
  <link rel="manifest" href="manifest.webmanifest">
  <!-- iOS PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Gestão Op">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="view" class="view"></main>

  <nav class="tabbar" id="tabbar">
    <a href="#/" class="tab" data-tab="dashboard">
      <svg viewBox="0 0 24 24"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>
      <span>Início</span>
    </a>
    <a href="#/nova" class="tab tab-add" data-tab="nova" aria-label="Nova conta">
      <span class="add-circle">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" fill="none"/></svg>
      </span>
    </a>
    <a href="#/contas" class="tab" data-tab="contas">
      <svg viewBox="0 0 24 24"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z"/></svg>
      <span>Contas</span>
    </a>
  </nav>

  <div id="toast" class="toast" role="status"></div>
  <div id="sheet-backdrop" class="sheet-backdrop hidden"></div>

  <script src="db.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
